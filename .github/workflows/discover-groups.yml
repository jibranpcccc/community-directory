name: Discover Communities

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    name: Run Automated Discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run discovery engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_SEARCH_ENABLED: ${{ vars.GEMINI_SEARCH_ENABLED || 'true' }}
          AUTO_PUBLISH_DISCOVERED: ${{ vars.AUTO_PUBLISH_DISCOVERED || 'true' }}
        run: npm run discover

      - name: Validate dataset schemas
        run: npm run validate-data

      - name: Commit and push discovered data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update discovered communities [skip ci]"
            git push
          fi

name: Quality Check CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    name: Lint, Test, Schema Validation & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Lint codebase
        run: npm run lint

      - name: Run unit test suite
        run: npm run test

      - name: Validate dataset schemas
        run: npm run validate-data

      - name: Test production static build
        run: npm run build
